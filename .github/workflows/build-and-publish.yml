name: Build and publish Nuxt app

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build SSR app
        run: pnpm build

      - name: Pack build output
        if: github.ref == 'refs/heads/main'
        run: tar -czf alopedia.tar.gz -C .output .

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: alopedia
          path: alopedia.tar.gz
          retention-days: 7

  # The same path as laraue-boards: the build goes to /home/laraue/alopedia on the server, and the
  # `alopedia` service of Laraue.Apps.Infra copies it into its image.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: alopedia-production
    steps:
      - name: Notify deploy started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 Deploy started: Alopedia (${{ github.sha }})"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: alopedia

      - name: Upload
        uses: marcodallasanta/ssh-scp-deploy@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          local: alopedia.tar.gz
          remote: '/home/laraue/alopedia'
          post_upload: |-
            cd /home/laraue/alopedia && find . -mindepth 1 ! -name alopedia.tar.gz -delete &&
            tar -xzf alopedia.tar.gz && rm alopedia.tar.gz

      - name: Build container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/laraue && docker compose build alopedia
            docker compose up -d --force-recreate alopedia

      - name: Notify deploy finished
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Deploy finished: Alopedia (${{ github.sha }})"

      - name: Notify deploy failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Deploy failed: Alopedia (${{ github.sha }})"
